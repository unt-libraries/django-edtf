[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "django-edtf"
description = "A Django app for the validation of dates in the Extended Date Time Format."
readme = "README.md"
version = "6.0.0"
license = "BSD-3-Clause"
license-files = ["LICENSE.txt"]
keywords = ["django", "validate", "edtf", "datetime"]
requires-python = ">=3.12,<3.15"
authors = [
  { name = "University of North Texas Libraries", email = "mark.phillips@unt.edu" }
]
classifiers = [
    "Natural Language :: English",
    "Environment :: Web Environment",
    "Framework :: Django :: 6.1",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
]
dependencies = [
    "Django~=6.1.0",
    "edtf-validate @ git+https://github.com/unt-libraries/edtf-validate.git@upgrade-python"
]

[project.urls]
Homepage = "https://github.com/unt-libraries/django-edtf"
Repository = "https://github.com/unt-libraries/django-edtf.git"


[project.optional-dependencies]
test = [
    "pytest~=9.0.3",
    "pytest-django~=4.5.2",
    "ruff~=0.15.9",
]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "tests.settings"
python_files = "tests/tests.py"

[tool.ruff]
line-length = 99
extend-exclude = ["migrations"]

[tool.ruff.format]
quote-style = "single"

[tool.ruff.lint]
select = ["E", "F", "W"]

[tool.tox]
legacy_tox_ini = """
    [tox]
    envlist =
        py3{12,13,14}
        py314-ruff
    skip_missing_interpreters = true

    [testenv]
    extras = 
        test
    commands = pytest

    [testenv:py314-ruff]
    commands = ruff check .
"""